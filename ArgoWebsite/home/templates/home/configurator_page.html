{% extends "base.html" %}
{% load static %}

{% block body_class %}{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'home/css/configurator_page.css' %}">
{% endblock extra_css %}

{% block content %}
<main x-data="globalData()">
<template x-if="!finalized">
    <section class="section-hero">
        <p class="section-hero__motto motto">
            Stwórz model dopasowany do siebie
        </p>
        <h1 class="section-hero__title title">
            Konfigurator produktu
        </h1>
        <p class="section-hero__text text">
            Konfigurator umożliwia samodzielne dobranie parametrów okien i drzwi stalowych - od wymiarów i podziałów, po kolor, szklenie i detale wykończenia. Po zakończeniu konfiguracji możesz otrzymać wstępną wycenę oraz przekazać projekt do bezpośredniego kontaktu z naszym zespołem. To szybki sposób, by przejść od pomysłu do realizacji.
        </p>
        <button class="section-hero__button button--variant_a" @click="activeSteps[0] = true">
            <span>START</span>
        </button>

    </section>
</template>
<template x-if="!finalized">
    <section class="section-configurator">
        <div class="step" id="step-1">
            <div class="section-configurator__headline">
                <button class="section-configurator__headline__button" @click="switchStep(0)">
                    <span style="color: transparent">Step 1</span>
                </button>
                <svg :class="`section-configurator__headline__svg ${activeSteps[0] ? 'active' : 'inactive'}`">
                    <use xlink:href="#argoArrow"></use>
                </svg>
                <div class="section-configurator__headline__content">
                    <h1 class="section-configurator__headline__content__motto motto">KROK 1</h1>
                    <h2 class="section-configurator__headline__content__subtitle subtitle">Wybór kolekcji</h2>
                </div>
            </div>
            <template x-if="activeSteps[0]">
                <div
                        class="section-configuration__content"
                        x-ref="step_1"
                        x-init="$refs.step_1.scrollIntoView({ behavior: 'instant', block: 'start' });"
                >
                    <p class="description text">Wybór jednej z trzech oferowanych linii stylistycznych.</p>

                    <div class="selection step-1">
                        <div :class="`selection__element step-1 ${selectedStyleLine === 'industrial' ? 'selection__element--selected' : ''}`" @mousedown="chooseStyleLine('industrial')">
                            <div class="selection__frame">
                                <img class="selection__frame__vis" src="{% static 'home/images/carpentry_steel_collections_industrial.webp' %}" alt="wizualizacja linii stylistycznej"/>
                            </div>
                            <div class="selection__description">
                                <h2 class="selection__description__subtitle subtitle">Linia Industrial</h2>
                                <p class="selection__description__text text">
                                    Lorem ipsum dolor sit amet, consectetuer
                                    adipiscing elit, sed diam nonummy nibh
                                    euismod tincidunt ut laoreet dolore magna
                                    aliquam erat volutpat. Ut wisi enim ad
                                    minim veniam, quis
                                </p>
                            </div>
                            <button class="selection__button variant_a" @click="chooseStyleLine('industrial')">
                                <span>Wybieram</span>
                            </button>
                        </div>
                        <div :class="`selection__element step-1 ${selectedStyleLine === 'vintage' ? 'selection__element--selected' : ''}`" @mousedown="chooseStyleLine('vintage')">
                            <div class="selection__frame">
                                <img class="selection__frame__vis" src="{% static 'home/images/carpentry_steel_collections_vintage.webp' %}" alt="wizualizacja linii stylistycznej"/>
                            </div>
                            <div class="selection__description">
                                <h2 class="selection__description__subtitle subtitle">Linia Vintage</h2>
                                <p class="selection__description__text text">
                                    Lorem ipsum dolor sit amet, consectetuer
                                    adipiscing elit, sed diam nonummy nibh
                                    euismod tincidunt ut laoreet dolore magna
                                    aliquam erat volutpat. Ut wisi enim ad
                                    minim veniam, quis
                                </p>
                            </div>
                            <button class="selection__button variant_a" @click="chooseStyleLine('vintage')">
                                <span>Wybieram</span>
                            </button>
                        </div>
                        <div :class="`selection__element step-1 ${selectedStyleLine === 'glamour' ? 'selection__element--selected' : ''}`" @mousedown="chooseStyleLine('glamour')">

                                <h2 class="selection__description__subtitle subtitle">Linia Glamour</h2>
                                <p class="selection__description__text text">

                                    adipiscing elit, sed diam nonummy nibh
                                    euismod tincidunt ut laoreet dolore magna

                                    minim veniam, quis

                            </div>
                            <button class="selection__button variant_a" @click="chooseStyleLine('glamour')">
                                <span>Wybieram</span>
                            </button>
                        </div>
                        <div class="section-configuration__dots">
                            <svg class="section-configuration__dot filled"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>

                    </div>

        </div>
        <div class="step" id="step-2">
            <div class="section-configurator__headline">
                <button class="section-configurator__headline__button" @click="switchStep(1)">
                    <span style="color: transparent">Step 2</span>
                </button>
                <svg :class="`section-configurator__headline__svg ${activeSteps[1] ? 'active' : 'inactive'}`">
                    <use xlink:href="#argoArrow"></use>
                </svg>
                <div class="section-configurator__headline__content">

            <template x-if="activeSteps[1]">

                        x-ref="step_2"
                        x-init="$refs.step_2.scrollIntoView({ behavior: 'instant', block: 'start' });"

                        Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat
                        volutpat.
                    </p>

                            </button>

                            </div>
                            <button class="selection__button variant_a" @click="chooseProductUsecase('profile-hot')">
                                <span>Wybieram</span>
                            </button>
                        </div>

                            <svg class="section-configuration__dot filled"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot filled"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                        </div>
                    </div>
                    <button class="selection__button variant_b" :disabled="!isProductUsecaseSelected" @click="confirmStep(1)">
                        <span>Potwierdź Wybór</span>
                    </button>
                </div>

        </div>
        <div class="step" id="step-3">

                    <h2 class="section-configurator__headline__content__subtitle subtitle">Wybór produktów</h2>
                </div>
            </div>
            <template x-if="activeSteps[2]">
                <div
                        class="section-configuration__content"
                        x-ref="step_3"
                        x-init="$refs.step_3.scrollIntoView({ behavior: 'instant', block: 'start' });"

                    <p class="description text">
                        Możliwość wyboru preferowanej konfiguracji produktu.
                    </p>
                    <div class="selection step-3">
                        <div :class="`selection__element step-3 ${selectedProductType === 'sliding' ? 'selection__element--selected' : ''}`" @mousedown="chooseProductType('sliding')">
                            <div class="selection__frame">
                                <img class="selection__description__vis" src="" alt="wizualizacja produktu"/>
                            </div>
                            <div class="selection__description">
                                <h3 class="selection__description__small-subtitle subtitle">Drzwi Przesuwne</h3>
                            </div>
                            <button class="selection__button variant_a" @click="chooseProductType('sliding')">
                                <span>Wybieram</span>
                            </button>
                        </div>
                        <div :class="`selection__element step-3 ${selectedProductType === 'hinged' ? 'selection__element--selected' : ''}`" @mousedown="chooseProductType('hinged')">
                            <div class="selection__frame">
                                <img class="selection__description__vis" src="" alt="wizualizacja produktu"/>
                            </div>
                            <div class="selection__description">
                                <h3 class="selection__description__small-subtitle subtitle">Drzwi i Okna Rozwierane</h3>
                            </div>
                            <button class="selection__button variant_a" @click="chooseProductType('hinged')">
                                <span>Wybieram</span>
                            </button>
                        </div>
                        <div :class="`selection__element step-3 ${selectedProductType === 'pivot' ? 'selection__element--selected' : ''}`" @mousedown="chooseProductType('pivot')">
                            <div class="selection__frame">
                                <img class="selection__description__vis" src="" alt="wizualizacja produktu"/>
                            </div>
                            <div class="selection__description">
                                <h3 class="selection__description__small-subtitle subtitle">Drzwi Wahadłowe</h3>
                            </div>
                            <button class="selection__button variant_a" @click="chooseProductType('pivot')">
                                <span>Wybieram</span>
                            </button>
                        </div>
                        <div :class="`selection__element step-3 ${selectedProductType === 'folding' ? 'selection__element--selected' : ''}`" @mousedown="chooseProductType('folding')">
                            <div class="selection__frame">
                                <img class="selection__description__vis" src="" alt="wizualizacja produktu"/>
                            </div>
                            <div class="selection__description">
                                <h3 class="selection__description__small-subtitle subtitle">Drzwi Harmonijkowe</h3>
                            </div>
                            <button class="selection__button variant_a" @click="chooseProductType('folding')">
                                <span>Wybieram</span>
                            </button>
                        </div>
                        <div :class="`selection__element step-3 ${selectedProductType === 'fixed' ? 'selection__element--selected' : ''}`" @mousedown="chooseProductType('fixed')">
                            <div class="selection__frame">
                                <img class="selection__description__vis" src="" alt="wizualizacja produktu"/>
                            </div>
                            <div class="selection__description">
                                <h3 class="selection__description__small-subtitle subtitle">Ścianki Stałe</h3>
                            </div>
                            <button class="selection__button variant_a" @click="chooseProductType('fixed')">
                                <span>Wybieram</span>
                            </button>
                        </div>
                        <div class="section-configuration__dots">
                            <svg class="section-configuration__dot filled"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot filled"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot filled"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                        </div>
                    </div>
                    <button class="selection__button variant_b" :disabled="!isProductTypeSelected" @click="confirmStep(2)">
                        <span>Potwierdź Wybór</span>
                    </button>
                </div>
            </template>
        </div>
        <div class="step" id="step-4">
            <div class="section-configurator__headline">
                <button class="section-configurator__headline__button" @click="switchStep(3)">
                    <span style="color: transparent">Step 4</span>
                </button>
                <svg :class="`section-configurator__headline__svg ${activeSteps[3] ? 'active' : 'inactive'}`">
                    <use xlink:href="#argoArrow"></use>
                </svg>
                <div class="section-configurator__headline__content">
                    <h1 class="section-configurator__headline__content__motto motto">KROK 4</h1>
                    <h2 class="section-configurator__headline__content__subtitle subtitle">Dopasuj układ</h2>
                </div>
            </div>
            <template x-if="activeSteps[3]">
                <div
                        class="section-configuration__content"
                        x-ref="step_4"
                        x-init="$refs.step_4.scrollIntoView({ behavior: 'instant', block: 'start' });"
                >
                    <div class="shape-configurator">
                        <div class="shape-configurator__visual">
                            <div class="svg-display" x-html="svgDisplayFile">

                            </div>
                        </div>
                        <div class="shape-configurator__input">
                            <template x-if="!(shapeLimitations.sides[0] === '')">
                                <div class="shape-configurator__input__section">
                                    <div class="shape-configurator__input__line">
                                        <template x-if="shapeLimitations.sides.includes('right')">
                                            <label class="input_text subtitle shape-configurator__input__option">
                                                <input class='sr-only' type="radio" name="door-side" value="right" x-model="shapeValues.doorSide"/>
                                                <span>Drzwi Prawe</span>
                                            </label>
                                        </template>
                                        <template x-if="shapeLimitations.sides.includes('left')">
                                            <label class="input_text subtitle shape-configurator__input__option">
                                                <input class='sr-only' type="radio" name="door-side" value="left" x-model="shapeValues.doorSide"/>
                                                <span>Drzwi Lewe</span>
                                            </label>
                                        </template>
                                        <template x-if="shapeLimitations.sides.includes('both')">
                                            <label class="input_text subtitle shape-configurator__input__option">
                                                <input class='sr-only' type="radio" name="door-side" value="both" x-model="shapeValues.doorSide"/>
                                                <span>Drzwi Prawe i Lewe</span>
                                            </label>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <template x-if="shapeLimitations.allowTop || shapeLimitations.allowLeft || shapeLimitations.allowRight">
                                <div class="shape-configurator__input__section">
                                    <template x-if="shapeLimitations.allowTop">

                                        <div class="shape-configurator__input__block">
                                            <input
                                                    id="product-skylight-enable"
                                                    type="checkbox"
                                                    x-model="shapeValues.isSkylightEnabled"
                                                    @input="updateShape()"
                                            />
                                            <label class="input_text subtitle" for="product-skylight-enable">Naświetla Górne?: </label>
                                        </div>
                                    </template>
                                    <template x-if="shapeLimitations.allowRight">
                                        <div class="shape-configurator__input__block">
                                            <input
                                                    id="product-right-enable"
                                                    type="checkbox"
                                                    x-model="shapeValues.isWindowsRightEnabled"
                                                    @input="updateShape()"
                                            />
                                            <label class="input_text subtitle" for="product-right-enable">Naświetla Prawe?: </label>
                                        </div>
                                    </template>
                                    <template x-if="shapeLimitations.allowLeft">
                                        <div class="shape-configurator__input__block">
                                            <input
                                                    id="product-left-enable"
                                                    type="checkbox"
                                                    x-model="shapeValues.isWindowsLeftEnabled"
                                                    @input="updateShape()"
                                            />
                                            <label class="input_text subtitle" for="product-left-enable">Naświetla Lewe?: </label>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <div class="shape-configurator__input__section">
                                <template x-if="shapeLimitations.allowLeft === false && shapeLimitations.allowRight === false">
                                    <div class="shape-configurator__input__flex">
                                        <label class="input_text subtitle" for="product-width">Szerokość: <span x-text="productWidth"></span> cm</label>

                                        <input
                                                id="product-width"
                                                type="range"
                                                min="2"
                                                max="10"
                                                x-model="input.totalWidth"
                                                @input="updateShape()"
                                        />
                                    </div>
                                </template>
                                <div class="shape-configurator__input__flex">
                                    <label class="input_text subtitle" for="product-height">Wysokość: <span x-text="productHeight"></span> cm</label>

                                    <input
                                            id="product-height"
                                            type="range"
                                            min="4"
                                            :max="`${shapeLimitations.doorMax.y}`"
                                            :disabled="shapeLimitations.doorMax.y === 4"
                                            x-model="input.totalHeight"
                                            @input="updateShape()"
                                    />
                                </div>

                                <template x-if="shapeLimitations.allowLeft === true || shapeLimitations.allowRight === true">
                                    <div class="shape-configurator__input__flex">
                                        <label class="input_text subtitle" for="door-width"> Szerokość Drzwi: <span x-text="doorWidth"></span> cm</label>

                                        <input
                                                id="door-width"
                                                type="range"
                                                min="2"
                                                :max="`${shapeLimitations.doorMax.x}`"
                                                x-model="input.doorWidth"
                                                :disabled="shapeLimitations.doorMax.x === 2"
                                                @input="updateShape()"
                                        />
                                    </div>
                                </template>
                                <template x-if="shapeLimitations.allowRight === true">
                                    <div class="shape-configurator__input__flex">
                                        <label class="input_text subtitle" for="right-width"> Szerokość Prawego Naświetla: <span x-text="rightWidth"></span> cm</label>

                                        <input
                                                id="right-width"
                                                type="range"
                                                min="1"
                                                :max="`${shapeLimitations.rightMax.x}`"
                                                x-model="input.rightWidth"
                                                :disabled="!shapeValues.isWindowsRightEnabled"
                                                @input="updateShape()"
                                        />
                                    </div>
                                </template>
                                <template x-if="shapeLimitations.allowLeft === true">
                                    <div class="shape-configurator__input__flex">
                                        <label class="input_text subtitle" for="left-width"> Szerokość Lewego Naświetla: <span x-text="leftWidth"></span> cm</label>

                                        <input
                                                id="left-width"
                                                type="range"
                                                min="1"
                                                :max="`${shapeLimitations.leftMax.x}`"
                                                x-model="input.leftWidth"
                                                :disabled="!shapeValues.isWindowsLeftEnabled"
                                                @input="updateShape()"
                                        />
                                    </div>
                                </template>
                            </div>

                        </div>
                        <div class="section-configuration__dots">
                            <svg class="section-configuration__dot filled"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot filled"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot filled"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot filled"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                            <svg class="section-configuration__dot empty"><use xlink:href="#dot"></use></svg>
                        </div>
                    </div>
                    <button class="selection__button variant_b" @click="confirmShape(); confirmStep(3);">
    <!--                <button class="selection__button" @click="updateProductData(exportData())">-->
                        <span>Potwierdź Układ</span>
                    </button>

                </div>
            </template>
        </div>
        <div class="step" id="step-5">
            <div class="section-configurator__headline">
                <button class="section-configurator__headline__button" @click="switchStep(4)">

                </button>
                <svg :class="`section-configurator__headline__svg ${activeSteps[4] ? 'active' : 'inactive'}`">

                </div>
            </div>
            <template x-if="activeSteps[4]">

                        class="section-configuration__content"
                        x-ref="step_5"

                        <div
                                :class="`selection__element step-5 ${selectedHandleType === 'handle-1' ? 'selection__element--selected' : ''}`" role="button" tabindex="0" aria-label="handle-1"
                                @click="chooseHandleType('handle-1')" @keydown.space.prevent="chooseHandleType('handle-1')" @keydown.enter.prevent="chooseHandleType('handle-1')"
                        >
                            <div class="selection__frame">
                                <img class="selection__description__vis" src="" alt="wizualizacja produktu"/>
                            </div>
                            <div class="selection__description">
                                <h2 class="selection__description__subtitle subtitle">Klamka - Styl 1</h2>
                                <p class="selection__description__text text">
                                    Lorem ipsum dolor sit amet, consectetuer
                                    adipiscing elit, sed diam nonummy nibh
                                    euismod tincidunt ut laoreet dolore magna
                                    aliquam erat volutpat. Ut wisi enim
                                    minim veniam, quis
                                </p>
